[package]
name = "velocidb"
version = "0.3.0"
edition = "2021"
rust-version = "1.70"
authors = ["Nikhil Ranjan <niklabh811@gmail.com>"]
description = "An embedded SQL database in Rust with a WAL, vector search, CDC and an async API"
license = "MIT"
repository = "https://github.com/niklabh/velocidb"
homepage = "https://niklabh.github.io/velocidb/"
documentation = "https://docs.rs/velocidb"
readme = "README.md"
keywords = ["database", "sqlite", "embedded", "async", "mvcc"]
categories = ["database-implementations"]

[dependencies]
parking_lot = "0.12"
crossbeam-epoch = "0.9"
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
memmap2 = "0.9"
rand = "0.8"
aho-corasick = "1.1"
rayon = "1.8"
libc = "0.2"
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
dashmap = "5.5"
num_cpus = "1.16"
regex = "1.10"
lazy_static = "1.4"
tracing = "0.1"
tracing-subscriber = "0.3"
rustyline = "13.0"
crc32fast = "1.4"

# Async I/O and runtime (optional)
tokio = { version = "1.35", features = ["full", "rt-multi-thread"], optional = true }
tokio-uring = { version = "0.4", optional = true }
futures = { version = "0.3", optional = true }
async-trait = { version = "0.1", optional = true }

# CRDT support (optional)
automerge = { version = "0.5", optional = true }

# Cloud storage (optional)
object_store = { version = "0.9", optional = true }

# Persistent memory (optional)
pmem = { version = "0.1.0", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"
proptest = "1.4"
quickcheck = "1.0"
crc32fast = "1.4"

[features]
default = ["async-io"]
async-io = ["tokio", "futures", "async-trait"]
io-uring = ["tokio-uring"]
pmem-support = ["pmem"]
crdt-sync = ["automerge"]
cloud-vfs = ["object_store"]
# Research modules not used by the SQL engine (mvcc, simd, lockfree, ...).
experimental = ["async-io"]

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
